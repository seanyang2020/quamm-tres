<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="704" viewBox="0 0 1280 704" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#8fa3bb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="704" fill="#f6f7f9"/>

  <text x="40" y="48" font-size="25" font-weight="700" fill="#16283d">B 域 · 设备注册（Web 与 MCP 双入口）</text>
  <text x="40" y="74" font-size="12.5" fill="#6b7a8d">登记不受限：探不到也进台账　｜　入池有门槛：只有 L3 才进可用池，申请者看不到其余设备</text>
  <line x1="40" y1="90" x2="1240" y2="90" stroke="#e2e8ef" stroke-width="1.2"/>

  <!-- 五步 -->
  <rect x="40" y="112" width="228" height="200" rx="9" fill="#fff" stroke="#c9d8ec"/>
  <circle cx="60" cy="134" r="11" fill="#20447a"/>
  <text x="60" y="138" font-size="11" fill="#fff" text-anchor="middle">1</text>
  <text x="78" y="139" font-size="12.5" font-weight="700" fill="#16283d">两个入口</text>
  <text x="54" y="162" font-size="10.2" fill="#54657a">MCP：只报 IP，先探后填</text>
  <text x="54" y="180" font-size="10.2" fill="#54657a">Web：先填 IP/MAC/名称</text>
  <text x="54" y="198" font-size="10.2" fill="#54657a">　　　再点「探测」补全</text>
  <text x="54" y="226" font-size="10.2" fill="#1b6a5c">两条进同一套判定</text>
  <text x="54" y="244" font-size="10.2" fill="#8b9aab">差别只在表单长在哪</text>
  <text x="54" y="272" font-size="9.8" fill="#a3b0c0">批量录入可一次贴 50 条</text>

  <line x1="268" y1="212" x2="282" y2="212" stroke="#8fa3bb" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="284" y="112" width="228" height="200" rx="9" fill="#fff" stroke="#c9d8ec"/>
  <circle cx="304" cy="134" r="11" fill="#1b6a5c"/>
  <text x="304" y="138" font-size="11" fill="#fff" text-anchor="middle">2</text>
  <text x="322" y="139" font-size="12.5" font-weight="700" fill="#16283d">自动探测</text>
  <text x="298" y="162" font-size="10.2" fill="#54657a">ping → 5555 → connect → shell</text>
  <text x="298" y="180" font-size="10.2" fill="#54657a">取 MAC / SN / 机型 / 版本</text>
  <text x="298" y="198" font-size="10.2" fill="#54657a">判断有无屏、有无 asset_tag</text>
  <text x="298" y="226" font-size="10.2" fill="#1b6a5c">L3 → 可直接入池</text>
  <text x="298" y="244" font-size="10.2" fill="#8a5a12">L2 = adbkey 没授权</text>
  <text x="298" y="262" font-size="10.2" fill="#8a5a12">L1 = 端口未开 / data 被擦</text>
  <text x="298" y="288" font-size="10.2" fill="#8a5a12">探不到也登记，只是不入池</text>

  <line x1="512" y1="212" x2="526" y2="212" stroke="#8fa3bb" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="529" y="112" width="228" height="200" rx="9" fill="#fff8ea" stroke="#e6cd9a"/>
  <circle cx="549" cy="134" r="11" fill="#8a5a12"/>
  <text x="549" y="138" font-size="11" fill="#fff" text-anchor="middle">3</text>
  <text x="567" y="139" font-size="12.5" font-weight="700" fill="#5c4514">返回一张表</text>
  <text x="543" y="162" font-size="10.2" fill="#6b5522">已探测字段：预填好</text>
  <text x="543" y="180" font-size="10.2" fill="#6b5522">待人补：位置编号</text>
  <text x="543" y="198" font-size="10.2" fill="#6b5522">待人补：维护责任人</text>
  <text x="543" y="226" font-size="10.2" fill="#5c4514" font-weight="700">带 form_id，30 分钟有效</text>
  <text x="543" y="244" font-size="10.2" fill="#8b9aab">同一 IP 重探返回同一表单</text>
  <text x="543" y="262" font-size="10.2" fill="#8b9aab">返回值带 next：告诉 Agent</text>
  <text x="543" y="280" font-size="10.2" fill="#8b9aab">「下一步让人做什么」</text>

  <line x1="757" y1="212" x2="771" y2="212" stroke="#8fa3bb" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="774" y="112" width="228" height="200" rx="9" fill="#fff" stroke="#dde3ea"/>
  <circle cx="794" cy="134" r="11" fill="#54657a"/>
  <text x="794" y="138" font-size="11" fill="#fff" text-anchor="middle">4</text>
  <text x="812" y="139" font-size="12.5" font-weight="700" fill="#16283d">可选：点亮核对</text>
  <text x="788" y="162" font-size="10.2" fill="#54657a">res_device_flash：让设备闪</text>
  <text x="788" y="180" font-size="10.2" fill="#54657a">屏全白/全红、LED 闪烁</text>
  <text x="788" y="198" font-size="10.2" fill="#54657a">人看到后回 res_device_confirm</text>
  <text x="788" y="226" font-size="10.2" fill="#1b6a5c">目的是证明：这台就是那台</text>
  <text x="788" y="244" font-size="10.2" fill="#8b9aab">不带屏不带灯的机型可跳过</text>
  <text x="788" y="262" font-size="10.2" fill="#8b9aab">跳过照常登记，只降置信度</text>

  <line x1="1002" y1="212" x2="1016" y2="212" stroke="#8fa3bb" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="1019" y="112" width="221" height="200" rx="9" fill="#eef7f2" stroke="#b6ddc9"/>
  <circle cx="1039" cy="134" r="11" fill="#1b6a5c"/>
  <text x="1039" y="138" font-size="11" fill="#fff" text-anchor="middle">5</text>
  <text x="1057" y="139" font-size="12.5" font-weight="700" fill="#0f4a3f">提交并落账</text>
  <text x="1033" y="162" font-size="10.2" fill="#2c6355">res_device_register</text>
  <text x="1033" y="180" font-size="10.2" fill="#2c6355">校验位置格式与重复</text>
  <text x="1033" y="198" font-size="10.2" fill="#2c6355">必填：位置 + 责任人</text>
  <text x="1033" y="226" font-size="10.2" fill="#0f4a3f" font-weight="700">L3 → available</text>
  <text x="1033" y="244" font-size="10.2" fill="#8a5a12" font-weight="700">否则 → pending</text>
  <text x="1033" y="266" font-size="10.2" fill="#8b9aab">两种都在台账里，都能绑</text>
  <text x="1033" y="284" font-size="10.2" fill="#8b9aab">位置、串口、机型</text>

  <!-- 四种结果 -->
  <rect x="40" y="336" width="290" height="112" rx="9" fill="#fff" stroke="#bfd2e8"/>
  <text x="58" y="362" font-size="12.5" font-weight="700" fill="#20447a">A · 认定为已有设备</text>
  <text x="58" y="384" font-size="10.3" fill="#54657a">强锚命中唯一一条记录</text>
  <text x="58" y="402" font-size="10.3" fill="#54657a">更新 IP / 版本 / 位置，不新建</text>
  <text x="58" y="424" font-size="10.3" fill="#8b9aab">换了 IP 也不会变成新设备</text>

  <rect x="342" y="336" width="290" height="112" rx="9" fill="#fff" stroke="#bfd2e8"/>
  <text x="360" y="362" font-size="12.5" font-weight="700" fill="#20447a">B · 新建一台设备</text>
  <text x="360" y="384" font-size="10.3" fill="#54657a">三项强锚都查不到</text>
  <text x="360" y="402" font-size="10.3" fill="#54657a">位置编号成为它的主锚</text>
  <text x="360" y="424" font-size="10.3" fill="#8b9aab">L3 则直接可用</text>

  <rect x="644" y="336" width="290" height="112" rx="9" fill="#fff" stroke="#bfd2e8"/>
  <text x="662" y="362" font-size="12.5" font-weight="700" fill="#20447a">D · 登记但不可用</text>
  <text x="662" y="384" font-size="10.3" fill="#54657a">探不到（L0/L1/L2）也建记录</text>
  <text x="662" y="402" font-size="10.3" fill="#54657a">状态 pending，不进可用池</text>
  <text x="662" y="424" font-size="10.3" fill="#8b9aab">巡检通了自动转 available</text>

  <rect x="946" y="336" width="294" height="112" rx="9" fill="#fff5f2" stroke="#efc8bb"/>
  <text x="964" y="362" font-size="12.5" font-weight="700" fill="#7a3418">C · 拒绝受理</text>
  <text x="964" y="384" font-size="10.3" fill="#6b4429">IP 已属别的设备</text>
  <text x="964" y="402" font-size="10.3" fill="#6b4429">MAC / SN 撞上另一条记录</text>
  <text x="964" y="424" font-size="10.3" fill="#8b9aab">位置编号重复</text>

  <!-- 关键约束 -->
  <rect x="40" y="466" width="1200" height="104" rx="9" fill="#eff4fb" stroke="#bfd2e8"/>
  <text x="60" y="492" font-size="13" font-weight="700" fill="#20447a">三条硬约束</text>
  <text x="60" y="514" font-size="10.5" fill="#54657a">① 位置编号只能人给，系统猜不出；格式固定（例 302-R2-05），重复即拒 —— 贴错标签比没标签更糟</text>
  <text x="60" y="533" font-size="10.5" fill="#54657a">② 探测拿不到的字段一律留空，绝不猜；表单里空着的字段人必须补，不补不让提交</text>
  <text x="60" y="552" font-size="10.5" fill="#54657a">③ 登记不设限、入池有门槛：pending 设备在台账里可见可维护，但申请者看不到它</text>

  <text x="40" y="596" font-size="10.5" fill="#a3b0c0">「虚假设备」不用专门防：巡检每轮验一遍，长期不通的设备会自己浮到管理员的待清理列表里，点一下就能摘</text>
  <text x="40" y="640" font-size="10.5" fill="#a3b0c0">设备由谁注册进来会记在案（管理员 / 个人 token 归属人），但谁注册都不改变共享属性 —— 责任人才是对这台设备负责的人</text>
  <text x="40" y="660" font-size="10.5" fill="#8a5a12">与注册对称的「解注册」：注册人可以把自己登记的设备收回；但占用中的设备必须先释放，否则只能挂「待下架」，等租约结束自动摘除</text>
</svg>
