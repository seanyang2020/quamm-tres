<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#8fa3bb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="400" fill="#f6f7f9"/>

  <text x="40" y="50" font-size="25" font-weight="700" fill="#16283d">凭据生命周期 · 邮件即凭据，只认 token</text>
  <text x="40" y="76" font-size="12.5" fill="#6b7a8d">没有「领取」环节：邮件里的 URL 直接可用，首次调用自动记一次首见信息，之后只校验 token</text>
  <line x1="40" y1="92" x2="1240" y2="92" stroke="#e2e8ef" stroke-width="1.2"/>

  <rect x="110" y="140" width="290" height="94" rx="10" fill="#fff" stroke="#dde3ea"/>
  <text x="255" y="172" font-size="15" font-weight="700" fill="#16283d" text-anchor="middle">已发放 issued</text>
  <text x="255" y="196" font-size="11" fill="#54657a" text-anchor="middle">邮件发出，token 在正文里</text>
  <text x="255" y="215" font-size="11" fill="#8b9aab" text-anchor="middle">当场就能用，无需任何激活动作</text>

  <line x1="400" y1="187" x2="452" y2="187" stroke="#8fa3bb" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="404" y="175" font-size="10.5" fill="#6b7a8d">首次调用</text>
  <text x="404" y="162" font-size="10.5" fill="#a3b0c0">自动，不用人操作</text>

  <rect x="460" y="140" width="290" height="94" rx="10" fill="#fff8ea" stroke="#e6cd9a"/>
  <text x="605" y="170" font-size="15" font-weight="700" fill="#5c4514" text-anchor="middle">已激活 active</text>
  <text x="605" y="192" font-size="11" fill="#6b5522" text-anchor="middle">记一次：Agent 名 / 来源 IP / 时间</text>
  <text x="605" y="211" font-size="11" fill="#8b9aab" text-anchor="middle">只记录，不参与任何校验</text>

  <line x1="750" y1="187" x2="802" y2="187" stroke="#8fa3bb" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="754" y="175" font-size="10.5" fill="#6b7a8d">90 天到期 / 吊销</text>

  <rect x="810" y="140" width="290" height="94" rx="10" fill="#f2f4f7" stroke="#c9d2dd"/>
  <text x="955" y="172" font-size="15" font-weight="700" fill="#4a5563" text-anchor="middle">终态</text>
  <text x="955" y="196" font-size="11" fill="#54657a" text-anchor="middle">已过期 expired · 已吊销 revoked</text>
  <text x="955" y="215" font-size="11" fill="#8b9aab" text-anchor="middle">不再放行，由管理员补发</text>

  <!-- 校验四件事 -->
  <rect x="110" y="262" width="1060" height="106" rx="10" fill="#eff4fb" stroke="#bfd2e8"/>
  <text x="130" y="288" font-size="13.5" font-weight="700" fill="#20447a">每次调用只校验四件事，其余一概不看</text>

  <rect x="130" y="300" width="230" height="52" rx="7" fill="#fff" stroke="#dbe6f2"/>
  <text x="146" y="322" font-size="11.5" font-weight="700" fill="#16283d">① token 存在且未吊销</text>
  <text x="146" y="341" font-size="10.5" fill="#54657a">查哈希，命中即认定是人</text>

  <rect x="376" y="300" width="230" height="52" rx="7" fill="#fff" stroke="#dbe6f2"/>
  <text x="392" y="322" font-size="11.5" font-weight="700" fill="#16283d">② 未过期</text>
  <text x="392" y="341" font-size="10.5" fill="#54657a">90 天，到期返回 401</text>

  <rect x="622" y="300" width="230" height="52" rx="7" fill="#fff" stroke="#dbe6f2"/>
  <text x="638" y="322" font-size="11.5" font-weight="700" fill="#16283d">③ 人的配额没超</text>
  <text x="638" y="341" font-size="10.5" fill="#54657a">按人合计，默认 2 台</text>

  <rect x="868" y="300" width="282" height="52" rx="7" fill="#fff" stroke="#dbe6f2"/>
  <text x="884" y="322" font-size="11.5" font-weight="700" fill="#16283d">④ 设备可用</text>
  <text x="884" y="341" font-size="10.5" fill="#54657a">L3 且未被独占；串口随设备一起</text>

  <text x="40" y="388" font-size="10.5" fill="#a3b0c0">不做：不校验来源 IP、不比对 Agent 名、不锁机器 —— token 在哪台机器用都放行；泄露了就在 Web 吊销这一条</text>
</svg>
