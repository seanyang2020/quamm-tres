<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#8fa3bb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#f6f7f9"/>

  <text x="40" y="50" font-size="26" font-weight="700" fill="#16283d">A 域 · Agent 注册与授权流程</text>
  <text x="40" y="77" font-size="13" fill="#6b7a8d">两条路径并存 · 凭据绑定「人 + Agent」 · 配额记在人头上</text>
  <line x1="40" y1="94" x2="1240" y2="94" stroke="#e2e8ef" stroke-width="1.2"/>

  <!-- 路径一 -->
  <rect x="40" y="110" width="600" height="500" rx="12" fill="#eff4fb" stroke="#bfd2e8"/>
  <rect x="40" y="110" width="600" height="46" rx="12" fill="#20447a"/>
  <rect x="40" y="142" width="600" height="14" fill="#20447a"/>
  <text x="60" y="140" font-size="15" font-weight="700" fill="#fff">路径一　Agent 自助注册 + 人审批</text>
  <text x="430" y="140" font-size="11" fill="#b9cfe8">默认推荐</text>

  <rect x="60" y="170" width="560" height="62" rx="8" fill="#fff" stroke="#dbe6f2"/>
  <circle cx="86" cy="201" r="12" fill="#20447a"/>
  <text x="86" y="205" font-size="11.5" fill="#fff" text-anchor="middle">1</text>
  <text x="110" y="195" font-size="12.5" font-weight="700" fill="#16283d">Agent 提交注册</text>
  <text x="110" y="215" font-size="10.8" fill="#54657a">Agent 名称 · 用途 · 所属人邮箱（用于找到人）</text>

  <rect x="60" y="242" width="560" height="62" rx="8" fill="#fff" stroke="#dbe6f2"/>
  <circle cx="86" cy="273" r="12" fill="#20447a"/>
  <text x="86" y="277" font-size="11.5" fill="#fff" text-anchor="middle">2</text>
  <text x="110" y="267" font-size="12.5" font-weight="700" fill="#16283d">返回配对码</text>
  <text x="110" y="287" font-size="10.8" fill="#54657a">配对码 A7K-92F3 + 授权链接，10 分钟失效，一次性</text>

  <rect x="60" y="314" width="560" height="62" rx="8" fill="#fff" stroke="#dbe6f2"/>
  <circle cx="86" cy="345" r="12" fill="#20447a"/>
  <text x="86" y="349" font-size="11.5" fill="#fff" text-anchor="middle">3</text>
  <text x="110" y="339" font-size="12.5" font-weight="700" fill="#16283d">人在 Web「待授权 Agent」里看到申请</text>
  <text x="110" y="359" font-size="10.8" fill="#54657a">展示来源 IP、UA、用途 —— 防止别人冒充「你的 Agent」</text>

  <rect x="60" y="386" width="560" height="62" rx="8" fill="#fff" stroke="#dbe6f2"/>
  <circle cx="86" cy="417" r="12" fill="#20447a"/>
  <text x="86" y="421" font-size="11.5" fill="#fff" text-anchor="middle">4</text>
  <text x="110" y="411" font-size="12.5" font-weight="700" fill="#16283d">人点「批准」，系统此时才生成凭据</text>
  <text x="110" y="431" font-size="10.8" fill="#54657a">未批准前 Agent 拿不到任何可用凭据</text>

  <rect x="60" y="458" width="560" height="62" rx="8" fill="#fff" stroke="#dbe6f2"/>
  <circle cx="86" cy="489" r="12" fill="#20447a"/>
  <text x="86" y="493" font-size="11.5" fill="#fff" text-anchor="middle">5</text>
  <text x="110" y="483" font-size="12.5" font-weight="700" fill="#16283d">Agent 轮询取到 token，只显示一次</text>
  <text x="110" y="503" font-size="10.8" fill="#54657a">落地到 MCP 配置，之后不再回显</text>

  <rect x="60" y="530" width="560" height="62" rx="8" fill="#fff" stroke="#dbe6f2"/>
  <circle cx="86" cy="561" r="12" fill="#20447a"/>
  <text x="86" y="565" font-size="11.5" fill="#fff" text-anchor="middle">6</text>
  <text x="110" y="555" font-size="12.5" font-weight="700" fill="#16283d">每次调用校验凭据状态</text>
  <text x="110" y="575" font-size="10.8" fill="#54657a">吊销即时生效，不靠缓存放过</text>

  <!-- 路径二 -->
  <rect x="660" y="110" width="580" height="500" rx="12" fill="#eef7f4" stroke="#b6d9ce"/>
  <rect x="660" y="110" width="580" height="46" rx="12" fill="#1b6a5c"/>
  <rect x="660" y="142" width="580" height="14" fill="#1b6a5c"/>
  <text x="680" y="140" font-size="15" font-weight="700" fill="#fff">路径二　人预创建 + 分发凭据</text>
  <text x="1030" y="140" font-size="11" fill="#a8d5c8">批量与固定场景</text>

  <rect x="680" y="170" width="540" height="62" rx="8" fill="#fff" stroke="#d3e7e1"/>
  <circle cx="706" cy="201" r="12" fill="#1b6a5c"/>
  <text x="706" y="205" font-size="11.5" fill="#fff" text-anchor="middle">1</text>
  <text x="730" y="195" font-size="12.5" font-weight="700" fill="#16283d">人在 Web「我的 Agent」新建槽位</text>
  <text x="730" y="215" font-size="10.8" fill="#54657a">命名「Cursor-1」· 选用途 · 选资源组 · 定有效期</text>

  <rect x="680" y="242" width="540" height="62" rx="8" fill="#fff" stroke="#d3e7e1"/>
  <circle cx="706" cy="273" r="12" fill="#1b6a5c"/>
  <text x="706" y="277" font-size="11.5" fill="#fff" text-anchor="middle">2</text>
  <text x="730" y="267" font-size="12.5" font-weight="700" fill="#16283d">系统生成一次性 token</text>
  <text x="730" y="287" font-size="10.8" fill="#54657a">或生成「领取码」，让 Agent 自己来取，不必粘贴</text>

  <rect x="680" y="314" width="540" height="62" rx="8" fill="#fff" stroke="#d3e7e1"/>
  <circle cx="706" cy="345" r="12" fill="#1b6a5c"/>
  <text x="706" y="349" font-size="11.5" fill="#fff" text-anchor="middle">3</text>
  <text x="730" y="339" font-size="12.5" font-weight="700" fill="#16283d">填进 MCP 配置</text>
  <text x="730" y="359" font-size="10.8" fill="#54657a">配置格式与路径一完全一致，Agent 侧无差别</text>

  <rect x="680" y="386" width="540" height="62" rx="8" fill="#fff" stroke="#d3e7e1"/>
  <circle cx="706" cy="417" r="12" fill="#1b6a5c"/>
  <text x="706" y="421" font-size="11.5" fill="#fff" text-anchor="middle">4</text>
  <text x="730" y="411" font-size="12.5" font-weight="700" fill="#16283d">首次调用即生效，无需再审批</text>
  <text x="730" y="431" font-size="10.8" fill="#54657a">适合给全组批量发、给 CI 机器人固定配置</text>

  <rect x="680" y="458" width="540" height="62" rx="8" fill="#fff" stroke="#d3e7e1"/>
  <circle cx="706" cy="489" r="12" fill="#1b6a5c"/>
  <text x="706" y="493" font-size="11.5" fill="#fff" text-anchor="middle">5</text>
  <text x="730" y="483" font-size="12.5" font-weight="700" fill="#16283d">到期前 7 天提醒续期</text>
  <text x="730" y="503" font-size="10.8" fill="#54657a">凭据有期限，不搞无限期长期票</text>

  <rect x="680" y="530" width="540" height="62" rx="8" fill="#f7fbf9" stroke="#d3e7e1"/>
  <text x="700" y="553" font-size="11.5" fill="#1b6a5c" font-weight="700">不做的一条：用人的 SSO 直接换 token</text>
  <text x="700" y="573" font-size="10.8" fill="#6b7a8d">审计里全是「人」，分不清是哪个 Agent；一个 Agent 出事，无法只吊销它</text>

  <!-- 共同结果 -->
  <rect x="40" y="630" width="1200" height="66" rx="10" fill="#fff" stroke="#c9d8ec"/>
  <text x="60" y="656" font-size="13.5" font-weight="700" fill="#20447a">两条路径产物相同</text>
  <text x="60" y="678" font-size="11.2" fill="#54657a">一条 agent_credential，同时绑定 principal_id（人）与 agent_id（Agent）；权限范围、有效期、吊销都以这条凭据为单元</text>
  <text x="1075" y="668" font-size="11.5" font-weight="700" fill="#8a5a12">配额永远记在人头上</text>

  <!-- 多 Agent 三点 -->
  <rect x="40" y="712" width="392" height="96" rx="10" fill="#fff" stroke="#dde3ea"/>
  <text x="58" y="738" font-size="13" font-weight="700" fill="#16283d">① 配额共享</text>
  <text x="58" y="759" font-size="10.8" fill="#54657a">一个人的 N 个 Agent 合计上限（默认 2 台）</text>
  <text x="58" y="778" font-size="10.8" fill="#8b9aab">跨 Agent 合计，否则注册三次就能绕过</text>

  <rect x="452" y="712" width="392" height="96" rx="10" fill="#fff" stroke="#dde3ea"/>
  <text x="470" y="738" font-size="13" font-weight="700" fill="#16283d">② 队列合并</text>
  <text x="470" y="759" font-size="10.8" fill="#54657a">同一人的多个 Agent 同时排队只占一个队位</text>
  <text x="470" y="778" font-size="10.8" fill="#8b9aab">否则自己的 Agent 会互相抢，还堵住别人</text>

  <rect x="864" y="712" width="376" height="96" rx="10" fill="#fff" stroke="#dde3ea"/>
  <text x="882" y="738" font-size="13" font-weight="700" fill="#16283d">③ 看板显示</text>
  <text x="882" y="759" font-size="10.8" fill="#54657a">「张三 · Cursor-1」</text>
  <text x="882" y="778" font-size="10.8" fill="#8b9aab">人找得到责任人，排查时知道是哪个 Agent</text>

  <text x="40" y="845" font-size="11" fill="#a3b0c0">图例：蓝 = 默认路径（自注册审批）　绿 = 备选路径（预创建分发）　两路径共用同一凭据模型与同一 MCP 配置格式</text>
</svg>
