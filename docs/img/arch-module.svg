<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1200" viewBox="0 0 1280 1200" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#8fa3bb"/>
    </marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#c6a068"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="1200" fill="#f6f7f9"/>

  <text x="40" y="50" font-size="26" font-weight="700" fill="#16283d">测试资源分配管理系统 · 功能模块框图</text>
  <text x="40" y="77" font-size="13" fill="#6b7a8d">三大功能域 · 按使用者视角划分 · 每个域内部自闭环，共用一套数据与入口</text>
  <line x1="40" y1="94" x2="1240" y2="94" stroke="#e2e8ef" stroke-width="1.2"/>

  <!-- 使用入口 -->
  <rect x="24" y="108" width="88" height="36" rx="6" fill="#27476e"/>
  <text x="68" y="131" font-size="12.5" fill="#fff" text-anchor="middle">入口</text>

  <rect x="132" y="108" width="540" height="84" rx="10" fill="#fff" stroke="#c9d8ec"/>
  <text x="152" y="137" font-size="15" font-weight="700" fill="#20447a">Web 控制台</text>
  <text x="152" y="159" font-size="11.5" fill="#54657a">人：看占用、排队、做管理</text>
  <text x="152" y="178" font-size="11.5" fill="#8b9aab">三个域同一个界面，只按角色开放不同操作</text>

  <rect x="700" y="108" width="540" height="84" rx="10" fill="#fff" stroke="#c9d8ec"/>
  <text x="720" y="137" font-size="15" font-weight="700" fill="#20447a">MCP 网关</text>
  <text x="720" y="159" font-size="11.5" fill="#54657a">AI：9 个 res_* 工具</text>
  <text x="720" y="178" font-size="11.5" fill="#8b9aab">申请与释放走这里；注册与管理不向普通 token 开放</text>

  <line x1="310" y1="192" x2="310" y2="332" stroke="#8fa3bb" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="688" y1="192" x2="688" y2="332" stroke="#8fa3bb" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="1066" y1="192" x2="1066" y2="332" stroke="#8fa3bb" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ========== 域 A 设备申请 ========== -->
  <rect x="132" y="340" width="354" height="574" rx="12" fill="#eff4fb" stroke="#bfd2e8"/>
  <rect x="132" y="340" width="354" height="46" rx="12" fill="#20447a"/>
  <rect x="132" y="372" width="354" height="14" fill="#20447a"/>
  <text x="152" y="370" font-size="15.5" font-weight="700" fill="#fff">A　设备申请</text>
  <text x="300" y="370" font-size="11" fill="#b9cfe8">面向使用者</text>

  <rect x="144" y="398" width="330" height="96" rx="8" fill="#fff" stroke="#dbe6f2"/>
  <text x="158" y="422" font-size="13" font-weight="700" fill="#16283d">A1　资源查询</text>
  <text x="158" y="443" font-size="10.8" fill="#54657a">可用 / 占用 / 离线 / 我排第几</text>
  <text x="158" y="462" font-size="10.8" fill="#8b9aab">按平台、位置、机型筛选</text>
  <text x="158" y="481" font-size="10.8" fill="#8b9aab">状态由服务端算一次，两端同一结论</text>

  <rect x="144" y="502" width="330" height="96" rx="8" fill="#fff" stroke="#dbe6f2"/>
  <text x="158" y="526" font-size="13" font-weight="700" fill="#16283d">A2　申请与授予</text>
  <text x="158" y="547" font-size="10.8" fill="#54657a">幂等键 · 配额校验 · 行锁原子授予</text>
  <text x="158" y="566" font-size="10.8" fill="#8b9aab">返回 adb 地址 + 串口 + 有效期</text>
  <text x="158" y="585" font-size="10.8" fill="#8b9aab">无空闲则转排队，不当失败处理</text>

  <rect x="144" y="606" width="330" height="96" rx="8" fill="#fff" stroke="#dbe6f2"/>
  <text x="158" y="630" font-size="13" font-weight="700" fill="#16283d">A3　租约与续约</text>
  <text x="158" y="651" font-size="10.8" fill="#54657a">TTL 30min · 主动续约 · 宽限 10min</text>
  <text x="158" y="670" font-size="10.8" fill="#8b9aab">不做高频心跳，长任务靠续约</text>
  <text x="158" y="689" font-size="10.8" fill="#8b9aab">到期强制回收并转 A5</text>

  <rect x="144" y="710" width="330" height="96" rx="8" fill="#fff" stroke="#dbe6f2"/>
  <text x="158" y="734" font-size="13" font-weight="700" fill="#16283d">A4　排队与唤醒</text>
  <text x="158" y="755" font-size="10.8" fill="#54657a">组队列 / 设备队列 · 优先级 + FIFO</text>
  <text x="158" y="774" font-size="10.8" fill="#8b9aab">只给队首发 offer，60s 确认窗口</text>
  <text x="158" y="793" font-size="10.8" fill="#8b9aab">短阻塞 + 票据轮询，不广播</text>

  <rect x="144" y="814" width="330" height="96" rx="8" fill="#fff" stroke="#dbe6f2"/>
  <text x="158" y="838" font-size="13" font-weight="700" fill="#16283d">A5　释放与回收</text>
  <text x="158" y="859" font-size="10.8" fill="#54657a">主动释放 · 超时强制回收 · 管理员收回</text>
  <text x="158" y="878" font-size="10.8" fill="#8b9aab">回收即在同一事务内唤醒下一位</text>

  <!-- ========== 域 B 设备注册 ========== -->
  <rect x="508" y="340" width="354" height="574" rx="12" fill="#eef7f4" stroke="#b6d9ce"/>
  <rect x="508" y="340" width="354" height="46" rx="12" fill="#1b6a5c"/>
  <rect x="508" y="372" width="354" height="14" fill="#1b6a5c"/>
  <text x="528" y="370" font-size="15.5" font-weight="700" fill="#fff">B　设备注册</text>
  <text x="676" y="370" font-size="11" fill="#a8d5c8">面向新设备</text>

  <rect x="520" y="398" width="330" height="96" rx="8" fill="#fff" stroke="#d3e7e1"/>
  <text x="534" y="422" font-size="13" font-weight="700" fill="#16283d">B1　发现与接入</text>
  <text x="534" y="443" font-size="10.8" fill="#54657a">网段扫描 · 手工录入 · 批量导入</text>
  <text x="534" y="462" font-size="10.8" fill="#8b9aab">adb connect 探测，先确认通不通</text>

  <rect x="520" y="502" width="330" height="96" rx="8" fill="#fff" stroke="#d3e7e1"/>
  <text x="534" y="526" font-size="13" font-weight="700" fill="#16283d">B2　身份采集</text>
  <text x="534" y="547" font-size="10.8" fill="#54657a">MAC / SN / 硬件 ID</text>
  <text x="534" y="566" font-size="10.8" fill="#54657a">/persist/asset_tag / 位置编号</text>
  <text x="534" y="585" font-size="10.8" fill="#8b9aab">采到什么就记什么，缺项不阻塞</text>

  <rect x="520" y="606" width="330" height="96" rx="8" fill="#fff" stroke="#d3e7e1"/>
  <text x="534" y="630" font-size="13" font-weight="700" fill="#16283d">B3　匹配与认定</text>
  <text x="534" y="651" font-size="10.8" fill="#54657a">打分 100 → 15 · 三档决策</text>
  <text x="534" y="670" font-size="10.8" fill="#54657a">A 主锚 MAC / B 主锚 SN / C 资产文件</text>
  <text x="534" y="689" font-size="10.8" fill="#8b9aab">强锚命中自动认定，弱信号进待确认</text>

  <rect x="520" y="710" width="330" height="96" rx="8" fill="#fff" stroke="#d3e7e1"/>
  <text x="534" y="734" font-size="13" font-weight="700" fill="#16283d">B4　漂移与冲突</text>
  <text x="534" y="755" font-size="10.8" fill="#54657a">换镜像 · 擦 SN · 全擦 · 换板 · MAC 克隆</text>
  <text x="534" y="774" font-size="10.8" fill="#8b9aab">能靠强锚证明就自动，不能就交 C3</text>

  <rect x="520" y="814" width="330" height="96" rx="8" fill="#fff" stroke="#d3e7e1"/>
  <text x="534" y="838" font-size="13" font-weight="700" fill="#16283d">B5　入池与标注</text>
  <text x="534" y="859" font-size="10.8" fill="#54657a">L3 shell 可用才允许入池（L0–L2 不入）</text>
  <text x="534" y="878" font-size="10.8" fill="#8b9aab">机型 · 平台 · 属性标签 · 串口绑定</text>

  <!-- ========== 域 C 设备管理 ========== -->
  <rect x="884" y="340" width="354" height="574" rx="12" fill="#fdf6ec" stroke="#e6cd9a"/>
  <rect x="884" y="340" width="354" height="46" rx="12" fill="#8a5a12"/>
  <rect x="884" y="372" width="354" height="14" fill="#8a5a12"/>
  <text x="904" y="370" font-size="15.5" font-weight="700" fill="#fff">C　设备管理</text>
  <text x="1052" y="370" font-size="11" fill="#eddaba">面向管理员</text>

  <rect x="896" y="398" width="330" height="96" rx="8" fill="#fff" stroke="#eadcc2"/>
  <text x="910" y="422" font-size="13" font-weight="700" fill="#16283d">C1　设备档案与位置</text>
  <text x="910" y="443" font-size="10.8" fill="#54657a">位置编号 302-R2-05 · 分组</text>
  <text x="910" y="462" font-size="10.8" fill="#54657a">维护责任人 · 在册 / 停用 / 报废</text>
  <text x="910" y="481" font-size="10.8" fill="#8b9aab">上线前盘库一次，否则位置锚不可信</text>

  <rect x="896" y="502" width="330" height="96" rx="8" fill="#fff" stroke="#eadcc2"/>
  <text x="910" y="526" font-size="13" font-weight="700" fill="#16283d">C2　状态与巡检</text>
  <text x="910" y="547" font-size="10.8" fill="#54657a">L0–L3 四级 · 15 / 30 min 可配</text>
  <text x="910" y="566" font-size="10.8" fill="#54657a">连续 2 轮判离线 · 恢复自动上线</text>
  <text x="910" y="585" font-size="10.8" fill="#8b9aab">原 L3 掉 L1 且 2 轮 → 疑似 data 被擦</text>

  <rect x="896" y="606" width="330" height="96" rx="8" fill="#fff" stroke="#eadcc2"/>
  <text x="910" y="630" font-size="13" font-weight="700" fill="#16283d">C3　人工介入台</text>
  <text x="910" y="651" font-size="10.8" fill="#54657a">认领 · 冲突裁决 · 换板确认</text>
  <text x="910" y="670" font-size="10.8" fill="#54657a">带屏 / LED 设备一键点亮核对</text>
  <text x="910" y="689" font-size="10.8" fill="#8b9aab">恢复指引 · 强制回收（须填原因）</text>

  <rect x="896" y="710" width="330" height="96" rx="8" fill="#fff" stroke="#eadcc2"/>
  <text x="910" y="734" font-size="13" font-weight="700" fill="#16283d">C4　通知与告警</text>
  <text x="910" y="755" font-size="10.8" fill="#54657a">掉线 / 疑似 data 被擦 / 超时回收</text>
  <text x="910" y="774" font-size="10.8" fill="#54657a">排队过久 · 恢复通知</text>
  <text x="910" y="793" font-size="10.8" fill="#8b9aab">同设备 2h 去重，不轰炸</text>

  <rect x="896" y="814" width="330" height="96" rx="8" fill="#fff" stroke="#eadcc2"/>
  <text x="910" y="838" font-size="13" font-weight="700" fill="#16283d">C5　审计、统计与权限</text>
  <text x="910" y="859" font-size="10.8" fill="#54657a">占用流水 · 利用率 · CSV 导出</text>
  <text x="910" y="878" font-size="10.8" fill="#8b9aab">账号 · token · 资源组白名单 · 并发配额</text>

  <!-- 底座 -->
  <line x1="310" y1="914" x2="310" y2="946" stroke="#8fa3bb" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="688" y1="914" x2="688" y2="946" stroke="#8fa3bb" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="1066" y1="914" x2="1066" y2="946" stroke="#8fa3bb" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>

  <rect x="24" y="950" width="88" height="36" rx="6" fill="#27476e"/>
  <text x="68" y="973" font-size="12.5" fill="#fff" text-anchor="middle">共用</text>

  <rect x="132" y="950" width="354" height="76" rx="10" fill="#fff" stroke="#dde3ea"/>
  <text x="150" y="976" font-size="13.5" font-weight="700" fill="#16283d">认证与配额</text>
  <text x="150" y="997" font-size="10.8" fill="#54657a">每人一 token · 并发上限跨入口合计</text>
  <text x="150" y="1015" font-size="10.8" fill="#8b9aab">管理类操作只对管理员角色注册</text>

  <rect x="508" y="950" width="354" height="76" rx="10" fill="#fff" stroke="#dde3ea"/>
  <text x="526" y="976" font-size="13.5" font-weight="700" fill="#16283d">定时调度（worker）</text>
  <text x="526" y="997" font-size="10.8" fill="#54657a">巡检 · 租约扫描 · 到期提醒 · 网段发现</text>
  <text x="526" y="1015" font-size="10.8" fill="#8b9aab">单实例锁，只触发不判业务</text>

  <rect x="884" y="950" width="354" height="76" rx="10" fill="#f1f5fb" stroke="#c9d8ec"/>
  <text x="902" y="976" font-size="13.5" font-weight="700" fill="#20447a">数据访问层 · PG 16</text>
  <text x="902" y="997" font-size="10.8" fill="#4a617f">device · lease · queue · claim · audit</text>
  <text x="902" y="1015" font-size="10.8" fill="#8b9aab">唯一能碰数据库的地方，事务在这</text>

  <line x1="688" y1="1026" x2="688" y2="1058" stroke="#c6a068" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#ad)"/>

  <!-- 外部 -->
  <rect x="24" y="1062" width="88" height="36" rx="6" fill="#27476e"/>
  <text x="68" y="1085" font-size="12.5" fill="#fff" text-anchor="middle">外部</text>

  <rect x="132" y="1062" width="354" height="76" rx="10" fill="#fff8ea" stroke="#e6cd9a"/>
  <text x="150" y="1088" font-size="13.5" font-weight="700" fill="#5c4514">设备池（网络 ADB）</text>
  <text x="150" y="1109" font-size="10.8" fill="#6b5522">500–750 台 · tcp 5555 · data 区钩子</text>

  <rect x="508" y="1062" width="354" height="76" rx="10" fill="#fff" stroke="#dde3ea"/>
  <text x="526" y="1088" font-size="13.5" font-weight="700" fill="#16283d">SerialBridge</text>
  <text x="526" y="1109" font-size="10.8" fill="#54657a">串口通道，本系统只发授权</text>

  <rect x="884" y="1062" width="354" height="76" rx="10" fill="#fff" stroke="#dde3ea"/>
  <text x="902" y="1088" font-size="13.5" font-weight="700" fill="#16283d">企业微信 / 飞书</text>
  <text x="902" y="1109" font-size="10.8" fill="#54657a">消息出口 · WebSocket 推送</text>

  <!-- 图例 -->
  <line x1="132" y1="1160" x2="182" y2="1160" stroke="#8fa3bb" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="192" y="1165" font-size="11" fill="#6b7a8d">调用 / 状态读写</text>
  <line x1="302" y1="1160" x2="352" y2="1160" stroke="#c6a068" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#ad)"/>
  <text x="362" y="1165" font-size="11" fill="#6b7a8d">探测 / 执行</text>
  <text x="470" y="1165" font-size="11" fill="#a3b0c0">三个域是功能划分，不是三个服务：同一后端、同一套数据、同一份领域逻辑，只是对使用者呈现为三块</text>
</svg>
