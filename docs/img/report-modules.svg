<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <style>
      .t-title{font-size:30px;font-weight:700;fill:#0f2740}
      .t-sub{font-size:14px;fill:#5b7185}
      .h{font-size:17px;font-weight:700;fill:#13324d}
      .hs{font-size:12px;fill:#5b7185}
      .m{font-size:13.5px;font-weight:700;fill:#1b3a55}
      .d{font-size:11.5px;fill:#5b7185}
    </style>
  </defs>
  <rect width="1280" height="940" fill="#f6f9fc"/>

  <text x="52" y="56" class="t-title">Quamm TRES 功能模块划分</text>
  <text x="52" y="80" class="t-sub">按「使用者视角」切成三个功能域：谁能拿资源 · 资源怎么进来 · 资源怎么管</text>
  <line x1="52" y1="98" x2="1228" y2="98" stroke="#dbe7f1" stroke-width="1"/>

  <!-- ========== A 域 ========== -->
  <rect x="52" y="118" width="376" height="26" fill="#2f6fa8" rx="4"/>
  <text x="66" y="136" font-size="12.5" font-weight="700" fill="#ffffff">A 域 · 设备申请（Agent 视角）</text>
  <text x="52" y="164" class="hs">使用者是 AI：申请、续约、释放全走 MCP，无登录无界面</text>

  <rect x="52" y="176" width="376" height="88" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="68" y="198" class="m">A1  身份与凭据</text>
  <text x="68" y="218" class="d">邮件正文直接是 token + 可用 URL，复制进配置即可用</text>
  <text x="68" y="236" class="d">一人一条 · 90 天 · 续期不换 token · 首次调用只记首见信息</text>
  <text x="68" y="254" class="d">每次调用只校验四件事：存在未吊销 / 未过期 / 配额 / 设备可用</text>

  <rect x="52" y="274" width="376" height="74" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="68" y="296" class="m">A2  资源发现</text>
  <text x="68" y="316" class="d">res_list_products 看机型与余量 · res_list_devices 看具体设备</text>
  <text x="68" y="334" class="d">res_device_info 单台详情（状态、位置、预计释放时间）</text>

  <rect x="52" y="358" width="376" height="88" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="68" y="380" class="m">A3  申请与租约</text>
  <text x="68" y="400" class="d">TTL 30min + 主动续约 + 宽限 10min，不做高频心跳</text>
  <text x="68" y="418" class="d">单人并发上限 2 台；申请设备默认连带锁定其全部串口</text>
  <text x="68" y="436" class="d">返回 adb 地址，Agent 直接连，不用再问人</text>

  <rect x="52" y="456" width="376" height="74" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="68" y="478" class="m">A4  排队与 offer</text>
  <text x="68" y="498" class="d">组队列（按机型）+ 设备队列（指定台）· priority 降序 + 严格 FIFO</text>
  <text x="68" y="516" class="d">释放只给队首发 offer，不广播；60 秒确认窗口，超时顺延</text>

  <rect x="52" y="540" width="376" height="74" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="68" y="562" class="m">A5  释放与回收</text>
  <text x="68" y="582" class="d">主动 res_release；到期由 worker 每 10s 扫描回收</text>
  <text x="68" y="600" class="d">掉线不改租约只标 degraded —— 不因巡检误伤使用者</text>

  <!-- ========== B 域 ========== -->
  <rect x="452" y="118" width="376" height="26" fill="#2a7f62" rx="4"/>
  <text x="466" y="136" font-size="12.5" font-weight="700" fill="#ffffff">B 域 · 设备注册（资源入口）</text>
  <text x="452" y="164" class="hs">回答一个问题：一台设备怎么变成「可被申请的池内资源」</text>

  <rect x="452" y="176" width="376" height="74" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="468" y="198" class="m">B1  双入口，同一判定</text>
  <text x="468" y="218" class="d">管理员 Web 批量录入（填 IP/MAC → 探测补全 → 核对）</text>
  <text x="468" y="236" class="d">Agent 走 MCP：res_device_probe → res_device_register</text>

  <rect x="452" y="258" width="376" height="74" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="468" y="280" class="m">B2  四级探测</text>
  <text x="468" y="300" class="d">L0 ICMP 不通 · L1 端口不通 · L2 unauthorized · L3 shell 可用</text>
  <text x="468" y="318" class="d">只有 L3 才有资格进可用池；探不到不算错，先登记</text>

  <rect x="452" y="340" width="376" height="88" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="468" y="362" class="m">B3  身份锚定</text>
  <text x="468" y="382" class="d">内部 device_id 做主键；MAC / SN / asset_tag / 位置 建唯一索引</text>
  <text x="468" y="400" class="d">打分：资产文件 100 · 硬件 ID 95 · MAC/SN 90 · 位置 85（强锚）</text>
  <text x="468" y="418" class="d">IP / 接入地址 40 · 型号 25 · 固件指纹 15（弱信号）</text>

  <rect x="452" y="436" width="376" height="74" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="468" y="458" class="m">B4  登记与入池分离</text>
  <text x="468" y="478" class="d">探不到也登记为 pending，不进可用池、申请者看不见</text>
  <text x="468" y="496" class="d">连续 1 轮 L3 自动转 available；30 天从未 L3 → 进「待清理」</text>

  <rect x="452" y="518" width="376" height="96" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="468" y="540" class="m">B5  注销与复活</text>
  <text x="468" y="560" class="d">注册人与管理员可注销，owner 不给注销权</text>
  <text x="468" y="578" class="d">有活动租约 → 拒绝或挂 pending_removal 待下架；注销要通知排队者</text>
  <text x="468" y="596" class="d">注销不删记录（retired），重注册强锚命中则复活原 device_id</text>

  <!-- ========== C 域 ========== -->
  <rect x="852" y="118" width="376" height="26" fill="#b5791f" rx="4"/>
  <text x="866" y="136" font-size="12.5" font-weight="700" fill="#ffffff">C 域 · 设备管理（管理员视角）</text>
  <text x="852" y="164" class="hs">只看 Web，八个一级菜单；Agent 只能查脱敏后的状态</text>

  <rect x="852" y="176" width="376" height="74" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="868" y="198" class="m">C1  主数据与档案</text>
  <text x="868" y="218" class="d">机型字典（预置、有界，不在字典里直接拒）/ 位置规则 / 设备档案</text>
  <text x="868" y="236" class="d">三字段分离：registered_by / register_channel / owner（人必填）</text>

  <rect x="852" y="258" width="376" height="88" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="868" y="280" class="m">C2  状态与巡检</text>
  <text x="868" y="300" class="d">一轮巡检 = 一条 run 记录；四块显示：上次/下次/24h 通过率/按机型</text>
  <text x="868" y="318" class="d">单轮失败 suspect，连续 2 轮 offline 才通知；恢复 1 轮即上线</text>
  <text x="868" y="336" class="d">连续 2 周期无新 run → 高优告警 + 看板红条「数据可能过期」</text>

  <rect x="852" y="354" width="376" height="74" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="868" y="376" class="m">C3  人工介入台</text>
  <text x="868" y="396" class="d">异常/待修复、待清理（pending 超 30 天）、强制释放</text>
  <text x="868" y="414" class="d">摘人与转移 owner；「点亮核对」用屏幕 4 位随机码 + 人回填</text>

  <rect x="852" y="438" width="376" height="88" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="868" y="460" class="m">C4  通知与告警</text>
  <text x="868" y="480" class="d">状态记在接收人身上：sent / delivered / failed / timeout / acked</text>
  <text x="868" y="498" class="d">24h 未 acked 升级；恢复要闭环并记响应时长</text>
  <text x="868" y="516" class="d">按位置前缀 15 分钟聚合防风暴；降级链 企微 → 邮件</text>

  <rect x="852" y="536" width="376" height="78" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.4" rx="8"/>
  <text x="868" y="558" class="m">C5  审计 · 统计 · 权限</text>
  <text x="868" y="578" class="d">审计流水（谁/何时/哪台/做了什么）；看板余量与占用分布</text>
  <text x="868" y="596" class="d">凭据台账（有效期、吊销、续期）；审计与凭据不对 Agent 开放</text>

  <!-- 共用层 -->
  <rect x="52" y="654" width="150" height="26" fill="#13324d" rx="4"/>
  <text x="64" y="672" class="lan" font-size="12.5" font-weight="700" fill="#ffffff">共用层</text>
  <text x="52" y="700" class="hs">三域共用同一套领域服务与数据；Web 与 MCP 调同一方法，可用性服务端只算一次</text>

  <rect x="52" y="712" width="1176" height="86" fill="#ffffff" stroke="#bcd3e6" stroke-width="1.5" rx="10"/>
  <rect x="72" y="728" width="134" height="54" fill="#f2f8fd" stroke="#c9d8e5" rx="5"/>
  <text x="86" y="750" class="d" font-size="12.5" font-weight="700">catalog</text>
  <text x="86" y="770" class="d">档案与注销</text>

  <rect x="218" y="728" width="134" height="54" fill="#f2f8fd" stroke="#c9d8e5" rx="5"/>
  <text x="232" y="750" class="d" font-size="12.5" font-weight="700">probe</text>
  <text x="232" y="770" class="d">四级探测</text>

  <rect x="364" y="728" width="134" height="54" fill="#f2f8fd" stroke="#c9d8e5" rx="5"/>
  <text x="378" y="750" class="d" font-size="12.5" font-weight="700">leasing</text>
  <text x="378" y="770" class="d">租约与回收</text>

  <rect x="510" y="728" width="134" height="54" fill="#f2f8fd" stroke="#c9d8e5" rx="5"/>
  <text x="524" y="750" class="d" font-size="12.5" font-weight="700">queueing</text>
  <text x="524" y="770" class="d">队列与 offer</text>

  <rect x="656" y="728" width="134" height="54" fill="#f2f8fd" stroke="#c9d8e5" rx="5"/>
  <text x="670" y="750" class="d" font-size="12.5" font-weight="700">patrol</text>
  <text x="670" y="770" class="d">巡检状态机</text>

  <rect x="802" y="728" width="134" height="54" fill="#f2f8fd" stroke="#c9d8e5" rx="5"/>
  <text x="816" y="750" class="d" font-size="12.5" font-weight="700">notices</text>
  <text x="816" y="770" class="d">通知与闭环</text>

  <rect x="948" y="728" width="134" height="54" fill="#f2f8fd" stroke="#c9d8e5" rx="5"/>
  <text x="962" y="750" class="d" font-size="12.5" font-weight="700">audit</text>
  <text x="962" y="770" class="d">审计留痕</text>

  <rect x="1094" y="728" width="134" height="54" fill="#f2f8fd" stroke="#c9d8e5" rx="5"/>
  <text x="1108" y="750" class="d" font-size="12.5" font-weight="700">security</text>
  <text x="1108" y="770" class="d">凭据校验</text>

  <!-- 底部边界 -->
  <rect x="52" y="820" width="1176" height="96" fill="#0f2740" rx="10"/>
  <text x="76" y="846" font-size="13" font-weight="700" fill="#9fc6e8">三域之间的三条边界约定</text>
  <text x="76" y="868" font-size="12" fill="#e8f1f8">① 注册不改变共享属性 —— 谁注册、走哪个入口，都不影响「进公共池」这件事；owner 只表示谁负责维护</text>
  <text x="76" y="888" font-size="12" fill="#e8f1f8">② 申请入口只有一个（MCP）—— Web 只是管理员后台，不给普通使用者开申请入口，避免两套口径</text>
  <text x="76" y="908" font-size="12" fill="#e8f1f8">③ 数据层共用、暴露面分级 —— 占用人对 Agent 脱敏（只给状态与预计释放时间），审计与凭据不对 Agent 开放</text>
</svg>
