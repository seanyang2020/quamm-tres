services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    env_file: .env
    ports:
      - "9100:9100"   # Web 控制台
      - "8765:9100"   # MCP 端点（同一 app，映射到容器内 9100）
    depends_on:
      - postgres
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    env_file: .env
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-res}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-res}
      POSTGRES_DB: ${POSTGRES_DB:-res}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
